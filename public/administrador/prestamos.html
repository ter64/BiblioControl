<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset='UTF-8'>
    <title>Préstamos - BiblioControl</title>
    <link rel="icon" href="../imagenes/logo.png" type="image/png" sizes="60x60">
    <link rel="stylesheet" href='../css/variables.css'>
    <link rel="stylesheet" href='../css/admin.css'>
    <link rel="stylesheet" href='../css/dark-mode.css'>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="dashboard-container">
    <aside class="sidebar">
        <nav class="menu">
            <a href="inicio-admin.html" class="logo">
                <img src="../imagenes/isl.png" alt="Logo">
            </a>
            <ul class="menu-items">
                <li><a href="inicio-admin.html"><i class="fa-solid fa-house"></i> <span>Inicio</span></a></li>
                <li><a href="libros.html"><i class="fa-solid fa-book"></i> <span>Libros</span></a></li>
                <li><a href="usuarios.html"><i class="fa-solid fa-users"></i> <span>Usuarios</span></a></li>
                <li class="active"><a href="prestamos.html"><i class="fa-solid fa-arrows-rotate"></i> <span>Préstamos</span></a></li>
                <li><a href="reportes.html"><i class="fa-solid fa-chart-simple"></i> <span>Reportes</span></a></li>
                <li><a href="configuracion.html"><i class="fa-solid fa-gear"></i> <span>Configuración</span></a></li>
            </ul>

            <div class="sidebar-footer">
                <button type="button" id="btnDarkMode" class="btn-icon" title="Cambiar tema">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <button type="button" id="btnLogout" class="btn-icon btn-logout" title="Cerrar sesión">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </nav>
    </aside>

    <div class="dashboard-body">
        <main class="dashboard">
            <section class="content-area">
                <h2>Gestión Préstamos</h2>
                <div class="section-header">
                    <h4><i class="fa-solid fa-plus"></i> Registrar Nuevo Préstamo</h4>
                </div>
                <form id="form-registrar-prestamo" class="form-group-inline">
                    <select name="id_cliente" class="form-input" required>
                        <option value="">Seleccionar cliente</option>
                        <!-- Se llena dinámicamente -->
                    </select>
                    <select name="id_libro" class="form-input" required>
                        <option value="">Seleccionar libro</option>
                        <!-- Se llena dinámicamente -->
                    </select>
                    <select name="id_admin" class="form-input" required>
                        <option value="">Seleccionar administrador</option>
                        <!-- Se llena dinámicamente -->
                    </select>
                    <input type="date" name="fecha_prestamo" class="form-input" required>
                    <input type="date" name="fecha_dev_prevista" class="form-input" required>
                    <button type="submit" class="btn-admin">Registrar Préstamo</button>
                </form>
            </section>

            <section class="content-area">
                <div class="section-header">
                    <h4><i class="fa-solid fa-list"></i> Historial de Préstamos</h4>
                </div>
                <div class="admin-table-wrapper">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Cliente</th>
                                <th scope="col">Libro</th>
                                <th scope="col">Fecha Préstamo</th>
                                <th scope="col">Fecha Dev. Prevista</th>
                                <th scope="col">Fecha Dev. Real</th>
                                <th scope="col">Estado</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-prestamos">
                            <!-- Se llena dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>

<script type="module">
    import { initPrestamos, initSidebarAdmin } from '../js/api-admin.js';
    initPrestamos();
    initSidebarAdmin();
</script>
</body>
</html>
