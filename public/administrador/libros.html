<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Libros - BiblioControl</title>
    <link rel="icon" href="../imagenes/logo.png" type="image/png" sizes="60x60">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/dark-mode.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="dashboard-container">
    <aside class="sidebar">
        <nav class="menu">
            <a href="inicio-admin.html" class="logo">
                <img src="../imagenes/isl.png" alt="Logo">
            </a>
            <ul class="menu-items">
                <li><a href="inicio-admin.html"><i class="fa-solid fa-house"></i> <span>Inicio</span></a></li>
                <li class="active"><a href="libros.html"><i class="fa-solid fa-book"></i> <span>Libros</span></a></li>
                <li><a href="usuarios.html"><i class="fa-solid fa-users"></i> <span>Usuarios</span></a></li>
                <li><a href="prestamos.html"><i class="fa-solid fa-arrows-rotate"></i> <span>Préstamos</span></a></li>
                <li><a href="reportes.html"><i class="fa-solid fa-chart-simple"></i> <span>Reportes</span></a></li>
                <li><a href="configuracion.html"><i class="fa-solid fa-gear"></i> <span>Configuración</span></a></li>
            </ul>

            <!-- ===== PIE DEL SIDEBAR ===== -->
            <div class="sidebar-footer">
                <button type="button" id="btnDarkMode" class="btn-icon" title="Cambiar tema">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <button type="button" id="btnLogout" class="btn-icon btn-logout" title="Cerrar sesión">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </nav>
    </aside>

    <div class="dashboard-body">
        <main class="dashboard">

            <!-- ===== AGREGAR LIBRO ===== -->
            <section class="content-area">
                <h2>Gestión de Libros</h2>
                <div class="section-header">
                    <h4><i class="fa-solid fa-plus"></i> Agregar Nuevo Libro</h4>
                </div>
                <form id="form-libro" class="form-group-inline">
                    <input type="text" name="titulo" placeholder="Título" class="form-input" required>
                    <input type="text" name="subtitulo" placeholder="Subtítulo" class="form-input">
                    <select name="id_categoria" class="form-input" required>
                        <option value="">Seleccionar categoría</option>
                        <!-- Se llena dinámicamente -->
                    </select>
                    <input type="number" name="precio" placeholder="Precio" step="0.00001" min="0.00001" class="form-input" required>
                    <input type="number" name="stock" placeholder="Stock" min="0" class="form-input" required>
                    <button type="submit" class="btn-admin">Guardar Libro</button>
                </form>
            </section>

            <!-- ===== LIBROS REGISTRADOS ===== -->
            <section class="content-area">
                <div class="section-header">
                    <h4><i class="fa-solid fa-list"></i> Libros Registrados</h4>
                </div>
                <div class="admin-table-wrapper">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Título</th>
                                <th scope="col">Subtítulo</th>
                                <th scope="col">Categoría</th>
                                <th scope="col">Precio</th>
                                <th scope="col">Stock</th>
                                <th scope="col">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-libros">
                            <!-- Se llena dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- ===== CATEGORÍAS ===== -->
            <section class="content-area">
                <div class="section-header">
                    <h4>Categorías</h4>
                </div>
                <div class="category-manager-box">
                    <form id="form-categoria" class="form-group-inline">
                        <input type="text" name="nombre_categoria" placeholder="Nueva categoría" class="form-input" required>
                        <button type="submit" class="btn-admin">Agregar Categoría</button>
                    </form>
                    <div class="admin-table-wrapper">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th scope="col">Categoría</th>
                                    <th scope="col">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-categorias">
                                <!-- Se llena dinámicamente -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

        </main>
    </div>
</div>

<script type="module">
    import { initLibros, initSidebarAdmin } from '../js/api-admin.js';
    initLibros();
    initSidebarAdmin();
</script>
</body>
</html>
