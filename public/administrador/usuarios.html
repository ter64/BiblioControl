<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='UTF-8'>
    <title>Gestión de Usuarios - BiblioControl</title>
    <link rel="icon" href="../imagenes/logo.png" type="image/png" sizes="60x60">
    <link rel='stylesheet' href='../css/variables.css'>
    <link rel='stylesheet' href='../css/admin.css'>
    <link rel="stylesheet" href="../css/dark-mode.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="dashboard-container">
    <aside class="sidebar">
        <nav class="menu">
            <a href="inicio-admin.html" class="logo">
                <img src="../imagenes/isl.png" alt="Logo">
            </a>
            <ul class="menu-items">
                <li><a href="inicio-admin.html"><i class="fa-solid fa-house"></i> <span>Inicio</span></a></li>
                <li><a href="libros.html"><i class="fa-solid fa-book"></i> <span>abLibros</span></a></li>
                <li class="active"><a href="usuarios.html"><i class="fa-solid fa-users"></i> <span>Usuarios</span></a></li>
                <li><a href="prestamos.html"><i class="fa-solid fa-arrows-rotate"></i> <span>Préstamos</span></a></li>
                <li><a href="reportes.html"><i class="fa-solid fa-chart-simple"></i> <span>Reportes</span></a></li>
                <li><a href="configuracion.html"><i class="fa-solid fa-gear"></i> <span>Configuración</span></a></li>
            </ul>

            <div class="sidebar-footer">
                <button type="button" id="btnDarkMode" class="btn-icon" title="Cambiar tema">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <button type="button" id="btnLogout" class="btn-icon btn-logout" title="Cerrar sesión">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </nav>
    </aside>

    <div class="dashboard-body">
        <main class="dashboard">

            <!-- ===== CLIENTES ===== -->
            <section class="content-area">
                <h2>Gestión de Usuarios</h2>
                <div class="section-header">
                    <h4><i class="fa-solid fa-user-plus"></i> Crear Nuevo Cliente</h4>
                </div>
                <form id="form-registrar-cliente" class="form-group-inline">
                    <input type="text" name="nombre" placeholder="Nombre" class="form-input" required>
                    <input type="email" name="correo" placeholder="Correo electrónico" class="form-input" required>
                    <input type="password" name="contraseña" placeholder="Contraseña" class="form-input" required>
                    <button type="submit" class="btn-admin">Registrar Cliente</button>
                </form>
            </section>

            <section class="content-area">
                <div class="section-header">
                    <h4><i class="fa-solid fa-users"></i> Clientes</h4>
                </div>
                <div class="admin-table-wrapper">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Nombre</th>
                                <th scope="col">Correo</th>
                                <th scope="col">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-clientes">
                            <!-- Se llena dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- ===== ADMINISTRADORES ===== -->
            <section class="content-area">
                <div class="section-header">
                    <h4><i class="fa-solid fa-user-shield"></i> Crear Nuevo Administrador</h4>
                </div>
                <form id="form-registrar-admin" class="form-group-inline">
                    <input type="text" name="nombre" placeholder="Nombre" class="form-input" required>
                    <input type="email" name="correo" placeholder="Correo electrónico" class="form-input" required>
                    <input type="password" name="contraseña" placeholder="Contraseña" class="form-input" required>
                    <button type="submit" class="btn-admin">Registrar Administrador</button>
                </form>
            </section>

            <section class="content-area">
                <div class="section-header">
                    <h4><i class="fa-solid fa-user-lock"></i> Administradores</h4>
                </div>
                <div class="admin-table-wrapper">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Nombre</th>
                                <th scope="col">Correo</th>
                                <th scope="col">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-administradores">
                            <!-- Se llena dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>
</div>

<script type="module">
    import { initUsuarios, initSidebarAdmin } from '../js/api-admin.js';
    initUsuarios();
    initSidebarAdmin();
</script>
</body>
</html>
