<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bibliocontrol - Inicio</title>
    <link rel="icon" href="../imagenes/logo.png" type="image/png" sizes="60x60">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/usuario.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="dashboard-container">
    <aside class="sidebar">
        <nav class="menu">
            <a href="inicio.html" class="logo">
                <img src="../imagenes/isl.png" alt="Logo BiblioControl">
            </a>
            <ul class="menu-items">
                <li class="active"><a href="inicio.html"><i class="fa-solid fa-house"></i><span>Inicio</span></a></li>
                <li><a href="favoritos.html"><i class="fa-solid fa-heart"></i><span>Favoritos</span></a></li>
                <li><a href="reservar.html"><i class="fa-solid fa-bookmark"></i><span>Reservar</span></a></li>
                <li><a href="historial.html"><i class="fa-solid fa-clock"></i><span>Historial</span></a></li>
                <li><a href="config.html"><i class="fa-solid fa-gear"></i><span>Configuración</span></a></li>
            </ul>
            
            <div class="sidebar-footer">
                <button type="button" id="btnDarkMode" class="btn-icon" title="Cambiar tema">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <button type="button" id="btnLogout" class="btn-icon btn-logout" title="Cerrar sesión">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </nav>
    </aside>

    <div class="dashboard-body">
        <header class="topbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar libros por título o subtítulo...">
                <button type="button" id="searchBtn" class="search-btn"><i class="fa-solid fa-search"></i></button>
            </div>
        </header>

        <main class="dashboard">
            <section class="content-area">
                <div class="section-header">
                    <h3>Categorías</h3>
                    <button class="btn-ver" id="btnVerTodas">Ver Todas</button>
                </div>
                <div class="categorias" id="categoriasContainer">
                    <span class="cargando-categorias">Cargando categorías...</span>
                </div>

                <div class="section-header">
                    <h3>Libros Recomendados</h3>
                    <button class="btn-ver" id="btnVerTodosLibros">Ver Todos</button>
                </div>
                <div class="productos" id="productosContainer">
                    <p class="cargando-libros">Cargando libros...</p>
                </div>
            </section>

            <aside class="dashboard-sidebar">
                <div class="calendario-panel">
                    <h4>Calendario de Devoluciones</h4>
                    <div class="calendario">
                        <div class="calendario-ver" id="calendarioContainer">
                            <span id="calendarioTexto">Cargando fechas previstas...</span>
                        </div>
                    </div>
                </div>

                <div class="devoluciones-panel">
                    <h4>Préstamos y Devoluciones</h4>
                    <div class="devoluciones" id="devolucionesContainer">
                        <p id="devolucionesCargando">Cargando estado de préstamos...</p>
                    </div>
                </div>
            </aside>
        </main>
    </div>
</div>

<script type="module">
    import { initInicio } from '../js/api-usuario.js';
    initInicio();
</script>
</body>
</html>
