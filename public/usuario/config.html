<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bibliocontrol - Configuración</title>
    <link rel="icon" href="../imagenes/logo.png" type="image/png" sizes="10x10">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/usuario.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="dashboard-container">

    <aside class="sidebar">
        <nav class="menu">
            <a href="inicio.html" class="logo">
                <img src="../imagenes/isl.png" width="24">
            </a>
            <ul class="menu-items">
                <li><a href="inicio.html"><i class="fa-solid fa-house"></i><span>Inicio</span></a></li>
                <li><a href="favoritos.html"><i class="fa-solid fa-heart"></i><span>Favoritos</span></a></li>
                <li><a href="reservar.html"><i class="fa-solid fa-bookmark"></i><span>Reservar</span></a></li>
                <li><a href="historial.html"><i class="fa-solid fa-clock"></i><span>Historial</span></a></li>
                <li class="active"><a href="config.html"><i class="fa-solid fa-gear"></i><span>Configuración</span></a></li>
            </ul>
        </nav>
    </aside>

    <div class="dashboard-body">
        <main class="dashboard dashboard--full">
            <section class="content-area">

                <div class="section-header">
                    <h3>Configuración</h3>
                </div>

                <div class="profile-card" id="profileCard">
                    <div class="profile-avatar">
                        <img src="../imagenes/isl.png" width="24">
                    </div>
                    <div class="profile-data" id="profileData">
                        <p class="user-display-name" id="userName">Cargando...</p>
                        <span class="user-email" id="userEmail">Cargando...</span>
                        <div>
                            <label for="inputNombre">Nombre</label><br>
                            <input type="text" id="inputNombre">
                        </div>
                        <button type="button" id="btnGuardarNombre">Guardar Cambios</button>
                    </div>
                </div>

                <div class="profile-card">
                    <h4>Cambiar Contraseña</h4>
                    <div>
                        <label for="inputPassActual">Contraseña Actual</label><br>
                        <input type="password" id="inputPassActual">
                    </div>
                    <div>
                        <label for="inputPassNueva">Nueva Contraseña</label><br>
                        <input type="password" id="inputPassNueva">
                    </div>
                    <div>
                        <label for="inputPassConfirm">Confirmar Nueva Contraseña</label><br>
                        <input type="password" id="inputPassConfirm">
                    </div>
                    <button type="button" id="btnCambiarPass">Cambiar Contraseña</button>
                </div>

                <div class="config-actions">
                    <a href="../index.html" class="btn-logout" id="btnLogout">Cerrar Sesión</a>
                </div>

            </section>
        </main>
    </div>
</div>

<script type="module">
    import { initConfig } from '../js/api-usuario.js';
    initConfig();
</script>
</body>
</html>
