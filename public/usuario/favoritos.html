<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bibliocontrol - Favoritos</title>
    <link rel="icon" href="../imagenes/logo.png" type="image/png" sizes="10x10">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="dashboard-container">

    <aside class="sidebar">
        <nav class="menu">
            <a href="inicio.html" class="logo">
                <img src="../imagenes/isl.png" width="24">
            </a>
            <ul class="menu-items">
                <li><a href="inicio.html"><i class="fa-solid fa-house"></i><span>Inicio</span></a></li>
                <li class="active"><a href="favoritos.html"><i class="fa-solid fa-heart"></i><span>Favoritos</span></a></li>
                <li><a href="reservar.html"><i class="fa-solid fa-bookmark"></i><span>Reservar</span></a></li>
                <li><a href="historial.html"><i class="fa-solid fa-clock"></i><span>Historial</span></a></li>
                <li><a href="config.html"><i class="fa-solid fa-gear"></i><span>Configuración</span></a></li>
            </ul>
        </nav>
    </aside>

    <div class="dashboard-body">
        <main class="dashboard dashboard--full">
            <section class="content-area">
                
                <div class="section-header">
                    <h3>Favoritos</h3>
                    <span id="favoritosContador" class="contador-favoritos">0</span>
                </div>
                
                <div class="fav-lista" id="favListaContainer">
                    <!-- Los favoritos se cargarán dinámicamente desde Supabase -->
                    <p id="favCargando" class="fav-mensaje">Cargando favoritos...</p>
                    <p id="favVacio" class="fav-mensaje" style="display: none;">
                        <i class="fa-regular fa-heart-crack"></i>
                        <br>No tienes libros en favoritos aún.
                    </p>
                </div>

            </section>
        </main>
    </div>
</div>
<script type="module" src="js/api.js"></script>
<script>
    import { initFavoritos } from './js/api.js';
    document.addEventListener('DOMContentLoaded', initFavoritos);
</script>
</body>
</html>
