<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bibliocontrol - Favoritos</title>
    <link rel="icon" href="../imagenes/logo.png" type="image/png" sizes="10x10">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/usuario.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="dashboard-container">

    <aside class="sidebar">
        <nav class="menu">
            <a href="inicio.html" class="logo">
                <img src="../imagenes/isl.png" width="24">
            </a>
            <ul class="menu-items">
                <li><a href="inicio.html"><i class="fa-solid fa-house"></i><span>Inicio</span></a></li>
                <li class="active"><a href="favoritos.html"><i class="fa-solid fa-heart"></i><span>Favoritos</span></a></li>
                <li><a href="reservar.html"><i class="fa-solid fa-bookmark"></i><span>Reservar</span></a></li>
                <li><a href="historial.html"><i class="fa-solid fa-clock"></i><span>Historial</span></a></li>
                <li><a href="config.html"><i class="fa-solid fa-gear"></i><span>Configuración</span></a></li>
            </ul>
        </nav>
    </aside>

    <div class="dashboard-body">
        <main class="dashboard dashboard--full">
            <section class="content-area">
                
                <div class="section-header">
                    <h3>Favoritos</h3>
                    <span id="favoritosContador" class="contador-favoritos">0</span>
                </div>
                
                <div class="fav-lista" id="favListaContainer">
                    <p>Cargando favoritos...</p>
                    <div class="fav-item">
                        <div class="fav-info">
                            <strong>${titulo}</strong>
                            <span>${categoria}</span>
                        </div>
                        <button class="fav-btn-remove" data-id="${fav.id}">...</button>
                    </div>
                </div>

            </section>
        </main>
    </div>
</div>

<script type="module">
    import { initFavoritos } from '../js/api-usuario.js';
    initFavoritos();
</script>
</body>
</html>
